# ============================================================
# Amazon Application — Kubernetes Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amazon-deployment
  namespace: amazon
  labels:
    app: amazon-app
    version: "1.0"
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amazon-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: amazon-app
        version: "1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "80"
        prometheus.io/path:   "/"

    spec:
      terminationGracePeriodSeconds: 60

      # ── Init container ─────────────────────────────────
      initContainers:
        - name: init-check
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Init: Pod=$(POD_NAME) Namespace=$(POD_NAMESPACE)"
              echo "Init complete — starting Amazon app container"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

      containers:
        - name: amazon-app
          # ── Replaced ACR image with public nginx image ──
          image: nginx:latest

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          # ── Resource limits ────────────────────────────
          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "500m"
              memory: "256Mi"

          # ─────────────────────────────────────────────────────
          # PROBE 1 — STARTUP PROBE
          # ─────────────────────────────────────────────────────
          startupProbe:
            httpGet:
              path:   /
              port:   80
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds:       10
            timeoutSeconds:      5
            successThreshold:    1
            failureThreshold:    30

          # ─────────────────────────────────────────────────────
          # PROBE 2 — LIVENESS PROBE
          # ─────────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path:   /
              port:   80
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds:       20
            timeoutSeconds:      5
            successThreshold:    1
            failureThreshold:    3

          # ─────────────────────────────────────────────────────
          # PROBE 3 — READINESS PROBE
          # ─────────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path:   /
              port:   80
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds:       10
            timeoutSeconds:      5
            successThreshold:    1
            failureThreshold:    3

          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]

          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: log-dir
              mountPath: /var/log/nginx

      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: log-dir
          emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [amazon-app]
                topologyKey: kubernetes.io/hostname
